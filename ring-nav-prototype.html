<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ring Nav Prototype</title>
<style>
  :root {
    --paper: oklch(95% .013 127);
    --ink: oklch(21% .037 134);
    --muted: oklch(53% .027 131);
    --rule: oklch(85% .015 127);
    --track: oklch(89% .016 128);
    --accent: oklch(45% .11 139);
    --short: oklch(53% .12 41);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(120% 140% at 50% -10%, oklch(30% .02 130) 0%, oklch(14% .015 130) 55%, oklch(9% .01 130) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .phone {
    position: relative;
    width: 340px;
    height: 700px;
    background: oklch(16% .01 130);
    border-radius: 52px;
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,.6),
      0 0 0 1px oklch(25% .01 130),
      inset 0 0 0 2px oklch(30% .01 130);
    padding: 16px;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--paper);
    border-radius: 38px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--rule);
  }

  .track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    will-change: transform;
    touch-action: none;
    cursor: grab;
  }
  .track.dragging { cursor: grabbing; }

  .slot {
    flex: 0 0 340px;
    width: 340px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px;
  }

  .card {
    width: 100%;
    height: 100%;
    border-radius: 30px;
    box-shadow:
      0 18px 40px -18px rgba(0,0,0,.35),
      inset 0 0 0 1px rgba(255,255,255,.15);
  }

  /* ring page tones — one family, varied lightness/chroma, no rainbow */
  .c0 { background: oklch(93% .02 127); }                 /* dashboard: near-paper */
  .c1 { background: oklch(78% .05 128); }                 /* wishlist */
  .c2 { background: oklch(63% .085 133); }                /* settings */
  .c3 { background: oklch(52% .105 137); }                /* base income */
  .c4 { background: oklch(45% .11 139); }                 /* flex income: --accent */
  .c5 { background: oklch(40% .10 140); }                 /* base spend */
  .c6 { background: oklch(56% .12 60); }                  /* flex spend: warm break */
  .c7 { background: oklch(70% .10 50); }                  /* calendar: warm light */
</style>
</head>
<body>

  <div class="phone">
    <div class="screen">
      <div class="track" id="track"></div>
    </div>
  </div>

<script>
  const COLORS = ['c0','c1','c2','c3','c4','c5','c6','c7'];
  const N = COLORS.length;
  const track = document.getElementById('track');

  // build N+2 slots: [clone(last), real0..realN-1, clone(first)]
  const order = [N - 1, ...Array.from({length: N}, (_, i) => i), 0];
  order.forEach(colorIdx => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    const card = document.createElement('div');
    card.className = 'card ' + COLORS[colorIdx];
    slot.appendChild(card);
    track.appendChild(slot);
  });

  const SLOT_W = 340;
  let index = 1; // position in the padded array; real page = index - 1
  let isDragging = false;
  let dragStartX = 0;
  let baseTranslate = 0;
  let currentTranslate = 0;
  let lastX = 0;
  let lastT = 0;
  let velocity = 0;

  const EASE = 'transform 380ms cubic-bezier(.22,.9,.32,1.1)';

  function setTransform(px, animate) {
    track.style.transition = animate ? EASE : 'none';
    track.style.transform = `translateX(${px}px)`;
  }

  function targetFor(i) {
    return -i * SLOT_W;
  }

  function goTo(i, animate = true) {
    index = i;
    setTransform(targetFor(index), animate);
  }

  track.addEventListener('transitionend', () => {
    if (index === 0) {
      index = N;
      setTransform(targetFor(index), false);
    } else if (index === N + 1) {
      index = 1;
      setTransform(targetFor(index), false);
    }
  });

  function pointerDown(e) {
    isDragging = true;
    track.classList.add('dragging');
    dragStartX = e.clientX;
    lastX = e.clientX;
    lastT = performance.now();
    velocity = 0;
    baseTranslate = targetFor(index);
    setTransform(baseTranslate, false);
    track.setPointerCapture(e.pointerId);
  }

  function pointerMove(e) {
    if (!isDragging) return;
    const now = performance.now();
    const dt = now - lastT;
    if (dt > 0) {
      velocity = (e.clientX - lastX) / dt; // px/ms
    }
    lastX = e.clientX;
    lastT = now;

    const delta = e.clientX - dragStartX;
    currentTranslate = baseTranslate + delta;
    setTransform(currentTranslate, false);
  }

  function pointerUp() {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');

    const delta = currentTranslate - baseTranslate;
    const DIST_THRESHOLD = SLOT_W * 0.22;
    const FLICK_THRESHOLD = 0.5; // px/ms

    let next = index;
    if (delta < -DIST_THRESHOLD || velocity < -FLICK_THRESHOLD) {
      next = index + 1;
    } else if (delta > DIST_THRESHOLD || velocity > FLICK_THRESHOLD) {
      next = index - 1;
    }
    goTo(next, true);
  }

  track.addEventListener('pointerdown', pointerDown);
  track.addEventListener('pointermove', pointerMove);
  track.addEventListener('pointerup', pointerUp);
  track.addEventListener('pointercancel', pointerUp);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(index - 1, true);
    if (e.key === 'ArrowRight') goTo(index + 1, true);
  });

  // initial position, no animation
  goTo(1, false);
</script>

</body>
</html>
